<!DOCTYPE html>
<html lang="sr-Latn">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Zahtev za procenu nameštaja</title></head>
  <body>
    <form name="procena" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="procena">
      <input name="bot-field">
      <input name="name">
      <input name="phone" type="tel">
      <input name="email" type="email">
      <input name="city">
      <textarea name="message"></textarea>
      <input name="photo" type="file">
      <input name="consent" type="checkbox">
    </form>
  </body>
</html>
